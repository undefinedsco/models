name: Publish NPM and Release Skill Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: yarn install --non-interactive --ignore-engines

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test:ci

      - name: Check skills
        run: yarn skills:check

      - name: Pack skills
        run: yarn skills:pack

      - name: Upload skill artifacts
        uses: actions/upload-artifact@v4
        with:
          name: models-skills-${{ github.run_number }}
          path: |
            preview/undefineds-co-models-skills-*.tgz
            preview/undefineds-co-models-codex-plugin-*.tgz
            preview/undefineds-co-models-claude-plugin-*.tgz

      - name: Publish skill artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Release $TAG"
          fi
          gh release upload "$TAG" \
            preview/undefineds-co-models-skills-*.tgz \
            preview/undefineds-co-models-codex-plugin-*.tgz \
            preview/undefineds-co-models-claude-plugin-*.tgz \
            --clobber

      - name: Check npm version
        id: npm-version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "@undefineds.co/models@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@undefineds.co/models@${PACKAGE_VERSION} already exists on npm; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack release
        if: steps.npm-version.outputs.exists != 'true'
        run: yarn pack:release

      - name: Publish to npm
        if: steps.npm-version.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public "./preview/undefineds-co-models-$(node -p "require('./package.json').version").tgz"
